name: 기능 추가
description: 새로운 기능을 제안합니다
labels: ['feat']
body:
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 추가하고 싶은 기능을 설명해주세요
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 구현에 필요한 세부 작업을 작성해주세요
      value: |
        - [ ]
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 디자인 시안, 관련 문서 등이 있다면 첨부해주세요
