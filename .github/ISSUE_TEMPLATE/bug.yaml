name: 버그 리포트
description: 버그를 제보합니다
labels: ['fix']
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계를 작성해주세요
      value: |
        1. 
        2. 
        3.
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작했을 때 어떤 결과를 기대하나요?
  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
      description: 관련 스크린샷이 있다면 첨부해주세요
